name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e . || true

      - name: Build
        run: python build.py all

      - name: Collect artifacts (non-Windows)
        if: runner.os != 'Windows'
        run: |
          mkdir dist-out
          cp dist/natbench dist-out/natbench-${{ matrix.label }} 2>/dev/null || true
          cp dist/natbench-gui dist-out/natbench-gui-${{ matrix.label }} 2>/dev/null || true

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-out | Out-Null
          if (Test-Path dist/natbench.exe) { Copy-Item dist/natbench.exe dist-out/natbench-${{ matrix.label }}.exe }
          if (Test-Path dist/natbench-gui.exe) { Copy-Item dist/natbench-gui.exe dist-out/natbench-gui-${{ matrix.label }}.exe }

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.label }}
          path: dist-out/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "build-*"
          merge-multiple: true
          path: all-dist/

      - name: Checksums
        run: |
          ls -lh all-dist/
          cd all-dist && sha256sum * > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" all-dist/* \
            --title "NatBench ${GITHUB_REF#refs/tags/}" \
            --generate-notes

name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e . || true

      - name: Build
        run: python build.py all

      - name: Collect (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir dist-out
          test -f dist/natbench && cp dist/natbench dist-out/natbench-${{ matrix.label }} || true
          test -f dist/natbench-gui && cp dist/natbench-gui dist-out/natbench-gui-${{ matrix.label }} || true

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-out
          if (Test-Path dist/natbench.exe) { cp dist/natbench.exe dist-out/natbench-${{ matrix.label }}.exe }
          if (Test-Path dist/natbench-gui.exe) { cp dist/natbench-gui.exe dist-out/natbench-gui-${{ matrix.label }}.exe }

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.label }}
          path: dist-out/
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist-out/

      - name: Checksums
        run: |
          ls -lh dist-out/
          cd dist-out
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" \
            --title "NatBench $TAG" \
            --notes "## NatBench $TAG

          Cross-platform DNS benchmark — 27 languages, 72+ servers, UDP/TCP/DoT/DoH.

          ### Downloads

          | Platform | CLI | GUI |
          |---|---|---|
          | Linux x86_64 | \`natbench-linux-x86_64\` | \`natbench-gui-linux-x86_64\` |
          | Windows x86_64 | \`natbench-windows-x86_64.exe\` | \`natbench-gui-windows-x86_64.exe\` |
          | macOS x86_64 | \`natbench-macos-x86_64\` | \`natbench-gui-macos-x86_64\` |

          ### Quick start (Linux/macOS)
          \`\`\`bash
          chmod +x natbench-linux-x86_64
          ./natbench-linux-x86_64 --top 10
          \`\`\`

          ### Via pip
          \`\`\`bash
          pip install natbench
          \`\`\`" \
            dist-out/*

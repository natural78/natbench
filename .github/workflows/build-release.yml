name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target (cli / gui / all)"
        required: false
        default: "all"

jobs:
  # ---------------------------------------------------------------------------
  # Build matrix — Linux x86_64, Windows, macOS
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_label: linux-x86_64
            cli_artifact: natbench
            gui_artifact: natbench-gui
          - os: windows-latest
            platform_label: windows-x86_64
            cli_artifact: natbench.exe
            gui_artifact: natbench-gui.exe
          - os: macos-latest
            platform_label: macos-x86_64
            cli_artifact: natbench
            gui_artifact: natbench-gui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Install optional package extras so they get bundled
          pip install -e ".[dev]" || pip install -e .

      - name: Build binaries
        run: python build.py all

      - name: Rename artifacts with platform label
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f "dist/${{ matrix.cli_artifact }}" ]; then
            cp "dist/${{ matrix.cli_artifact }}" "artifacts/natbench-${{ matrix.platform_label }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          fi
          if [ -f "dist/${{ matrix.gui_artifact }}" ]; then
            cp "dist/${{ matrix.gui_artifact }}" "artifacts/natbench-gui-${{ matrix.platform_label }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          fi
          ls -lh artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natbench-${{ matrix.platform_label }}
          path: artifacts/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Build — Linux ARM64 (ubuntu-24.04-arm runner)
  # ---------------------------------------------------------------------------
  build-arm64:
    name: Build (linux-aarch64)
    runs-on: ubuntu-24.04-arm
    # ARM runners may not always be available; continue even if this fails
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[dev]" || pip install -e .

      - name: Build CLI binary
        run: python build.py cli

      - name: Rename artifact
        run: |
          mkdir -p artifacts
          cp dist/natbench artifacts/natbench-linux-aarch64

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: natbench-linux-aarch64
          path: artifacts/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Release job — only runs on tag push, collects all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # Only create a release when triggered by a version tag
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          # Download all artifacts from the build matrix
          merge-multiple: false

      - name: List downloaded artifacts
        run: find release-artifacts -type f | sort

      - name: Flatten artifact files into one directory
        run: |
          mkdir -p dist-release
          find release-artifacts -type f -exec cp {} dist-release/ \;
          ls -lh dist-release/

      - name: Generate checksums
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "NatBench ${{ steps.tag.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist-release/*
          body: |
            ## NatBench ${{ steps.tag.outputs.version }}

            ### Downloads

            | Platform | CLI | GUI |
            |----------|-----|-----|
            | Linux x86_64 | `natbench-linux-x86_64` | `natbench-gui-linux-x86_64` |
            | Linux ARM64  | `natbench-linux-aarch64` | — |
            | Windows x86_64 | `natbench-windows-x86_64.exe` | `natbench-gui-windows-x86_64.exe` |
            | macOS x86_64 | `natbench-macos-x86_64` | `natbench-gui-macos-x86_64` |

            ### Verify checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### Quick start (Linux/macOS)
            ```bash
            chmod +x natbench-linux-x86_64
            ./natbench-linux-x86_64 --help
            ```

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_target:
        description: "Build target (cli / gui / all)"
        required: false
        default: "all"

jobs:
  # ---------------------------------------------------------------------------
  # Build matrix — Linux x86_64, Windows, macOS
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.platform_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_label: linux-x86_64
            ext: ""
          - os: windows-latest
            platform_label: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            platform_label: macos-x86_64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[dev]" || pip install -e .

      - name: Build binaries
        run: python build.py all

      - name: Collect artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          [ -f dist/natbench ] && cp dist/natbench artifacts/natbench-${{ matrix.platform_label }}
          [ -f dist/natbench-gui ] && cp dist/natbench-gui artifacts/natbench-gui-${{ matrix.platform_label }}
          ls -lh artifacts/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path dist/natbench.exe) { Copy-Item dist/natbench.exe artifacts/natbench-${{ matrix.platform_label }}.exe }
          if (Test-Path dist/natbench-gui.exe) { Copy-Item dist/natbench-gui.exe artifacts/natbench-gui-${{ matrix.platform_label }}.exe }
          Get-ChildItem artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natbench-${{ matrix.platform_label }}
          path: artifacts/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Release job — only runs on tag push
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List and checksum
        run: |
          ls -lh release-artifacts/
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "NatBench ${{ steps.tag.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.version, '-') }}
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            ## NatBench ${{ steps.tag.outputs.version }}

            Cross-platform DNS benchmark tool — 27 languages, 72+ servers, UDP/TCP/DoT/DoH.

            ### Downloads

            | Platform | CLI | GUI |
            |----------|-----|-----|
            | Linux x86_64 | `natbench-linux-x86_64` | `natbench-gui-linux-x86_64` |
            | Windows x86_64 | `natbench-windows-x86_64.exe` | `natbench-gui-windows-x86_64.exe` |
            | macOS x86_64 | `natbench-macos-x86_64` | `natbench-gui-macos-x86_64` |

            ### Verify checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            ### Quick start (Linux/macOS)
            ```bash
            chmod +x natbench-linux-x86_64
            ./natbench-linux-x86_64 --top 10
            ```

            ### Via pip (all platforms)
            ```bash
            pip install natbench
            natbench --top 10
            ```

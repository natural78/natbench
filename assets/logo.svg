<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1f3c"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="arc2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8e0ff"/>
    </linearGradient>
    <filter id="g2"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="20" fill="url(#bg2)"/>

  <!-- Mini icon (scaled down, centered in left 200px) -->
  <!-- gauge track: center(100,115) r=65 -->
  <!-- 225°: x=100-45.96=54, y=115+45.96=161 -->
  <!-- 315°: x=145.96≈146, y=161 -->
  <path d="M 54 161 A 65 65 0 1 0 146 161"
        fill="none" stroke="#1e3a5f" stroke-width="12" stroke-linecap="round"/>
  <!-- Active arc to ~30°: x=100+65*cos(30°)=100+56.3=156.3, y=115-65*sin(30°)=115-32.5=82.5 -->
  <path d="M 54 161 A 65 65 0 1 0 156 83"
        fill="none" stroke="url(#arc2)" stroke-width="12" stroke-linecap="round" filter="url(#g2)"/>
  <!-- Speed dot -->
  <circle cx="156" cy="83" r="9" fill="#00ff88" filter="url(#g2)"/>

  <!-- Network nodes (mini) -->
  <circle cx="100" cy="48" r="5" fill="#00d4ff" opacity="0.8"/>
  <circle cx="65" cy="68" r="4" fill="#00d4ff" opacity="0.55"/>
  <circle cx="135" cy="68" r="4" fill="#00d4ff" opacity="0.55"/>
  <g stroke="#00d4ff" stroke-width="1" opacity="0.3">
    <line x1="100" y1="105" x2="100" y2="53"/>
    <line x1="100" y1="105" x2="68" y2="71"/>
    <line x1="100" y1="105" x2="132" y2="71"/>
  </g>
  <!-- Center hub -->
  <circle cx="100" cy="105" r="10" fill="#0a1628" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="100" cy="105" r="4" fill="#00d4ff"/>

  <!-- Wordmark -->
  <text x="220" y="108" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif"
        font-size="72" font-weight="800" letter-spacing="-2" fill="url(#textGrad)">Nat</text>
  <text x="353" y="108" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif"
        font-size="72" font-weight="300" letter-spacing="-1" fill="#00d4ff">Bench</text>

  <!-- Tagline -->
  <text x="220" y="142" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif"
        font-size="20" font-weight="400" fill="#8ba3c7" letter-spacing="2">DNS BENCHMARK &amp; OPTIMIZER</text>

  <!-- Decorative separator line -->
  <line x1="220" y1="120" x2="700" y2="120" stroke="#1e3a5f" stroke-width="1" opacity="0.6"/>
</svg>
